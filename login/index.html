<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AnajakCode</title>
    <meta name="description" content="Sign in to your AnajakCode account">
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/styles.css">
    
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .login-card {
            max-width: 440px;
            width: 100%;
            padding: 40px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .logo-wrapper {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            margin: 0 auto 16px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        
        .input-wrapper input {
            padding-left: 44px;
        }
    </style>
</head>
<body>
    <!-- Background Orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-wrapper">
                <a href="/">
                    <img src="https://i.ibb.co/7xPKHNSK/smail.webp" alt="AnajakCode" class="logo-img">
                </a>
                <h1 class="text-2xl font-bold gradient-text mb-1">Welcome Back</h1>
                <p class="text-sm" style="color: var(--text-secondary);">Sign in to continue to AnajakCode</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" name="username" required placeholder="Enter your username" autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
                    </div>
                </div>
                
                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center gap-2 text-sm" style="color: var(--text-secondary);">
                        <input type="checkbox" id="remember-me" style="width: auto;">
                        Remember me
                    </label>
                    <a href="#" class="text-sm text-emerald-400 hover:text-emerald-300">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn-primary w-full py-3 rounded-xl font-semibold" id="login-btn">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    <span>Sign In</span>
                </button>
            </form>
            
            <div class="mt-6 text-center text-sm">
                <span style="color: var(--text-secondary);">Don't have an account?</span>
                <a href="/register/" class="text-emerald-400 hover:text-emerald-300 ml-1 font-semibold">Register</a>
            </div>
            
            <div class="mt-6 text-center">
                <a href="/" class="text-sm" style="color: var(--text-muted);">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { Auth } from '/js/auth.js';
        import { Theme } from '/js/theme.js';
        import { showError, showSuccess } from '/js/notifications.js';
        import { Router } from '/js/router.js';
        
        Theme.init();
        
        // Redirect if already logged in
        if (Auth.isAuthenticated()) {
            const redirect = Router.getQueryParam('redirect') || '/deshboard/';
            window.location.href = redirect;
        }
        
        const form = document.getElementById('login-form');
        const btn = document.getElementById('login-btn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const username = formData.get('username');
            const password = formData.get('password');
            
            // Disable button
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> <span>Signing in...</span>';
            
            try {
                await Auth.login(username, password);
                const redirect = Router.getQueryParam('redirect') || '/deshboard/';
                window.location.href = redirect;
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>';
            }
        });
    </script>
</body>
</html>
